services:
  vite:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app:Z
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    init: true

volumes:
  node_modules:
